<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nirapod — Everyday Personal Safety & Emergency HCI Survey</title>
  <meta name="description" content="A Human-Computer Interaction (HCI) study on user phone behavior and emergency feature usability during unsafe situations in daily life.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Main Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Glow Background Canvas Elements -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <div class="app-layout">
    <!-- Top Navigation Header -->
    <header class="topbar">
      <div class="brand-group">
        <div class="logo-badge">
          <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>
        </div>
        <div>
          <span class="wordmark">Nirapod</span>
          <span class="submark">Everyday Safety HCI Study</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Progress Pills & Drawer Trigger -->
        <button class="nav-drawer-btn" id="drawerToggleBtn" aria-label="Toggle section overview" title="Survey Map & Progress">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span class="drawer-btn-text" id="headerStepCounter">Intro</span>
        </button>

        <!-- Theme Toggle -->
        <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

      </div>
    </header>

    <!-- Global Progress Bar Header -->
    <div class="progress-bar-container" id="progressBarWrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-meta">
        <span class="progress-section-name" id="progressSectionName">Welcome</span>
        <span class="progress-percentage" id="progressPct">0%</span>
      </div>
    </div>

    <!-- Main Dynamic Application Container -->
    <main class="main-content">
      <div class="card" id="app-root">
        <!-- Rendered dynamically by script.js -->
      </div>
    </main>

    <!-- Keyboard Navigation Footer Bar -->
    <footer class="foot-note">
      <div class="keyboard-tips" id="keyboardTips">
        <span class="tip-pill"><kbd>1</kbd>–<kbd>9</kbd> Select option</span>
        <span class="tip-pill"><kbd>Enter ↵</kbd> Next</span>
        <span class="tip-pill"><kbd>Esc</kbd> / <kbd>←</kbd> Back</span>
      </div>
      <p class="foot-text">
        CSE 4451 Human-Computer Interaction Study • United International University. <br>
        Anonymous academic research on phone interaction under high-stress or unsafe scenarios in daily life.
      </p>
    </footer>
  </div>

  <!-- Section Drawer / Jump Overlay -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3>Survey Overview</h3>
        <button class="icon-btn" id="closeDrawerBtn" aria-label="Close overview">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerList">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
